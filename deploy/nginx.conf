# Reverse-proxy для Financial Analyzer.
#
# Схема:  браузер → nginx (TLS, 443) → 127.0.0.1:8088 (Go-сервис).
#
# Приложение слушает PORT из .env (по умолчанию 8088). Наружу торчит nginx;
# порт 8088 закройте в firewall.
#
# Установка (замените server_name на реальный домен):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/financialanalyzer
#   sudo ln -s /etc/nginx/sites-available/financialanalyzer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d financialanalyzer.local -d www.financialanalyzer.local
#
# certbot сам добавит блок `listen 443 ssl` с сертификатом, редирект с 80 на 443
# и настроит авто-продление — руками эту часть писать не нужно.

server {
    listen 80;
    listen [::]:80;
    server_name financialanalyzer.local www.financialanalyzer.local;

    # Пакет годовых МСФО — до 8 МБ (см. maxImportBytes).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8088;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
